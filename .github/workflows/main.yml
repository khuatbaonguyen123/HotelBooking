name: JMeter Test

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Run JMeter Tests
        run: |
          java --add-opens java.base/java.lang=ALL-UNNAMED -jar ApacheJMeter.jar -jjmeter.save.saveservice.output_format=xml -n -t ./signin.jmx -l report.jtl
